# Codemagic: macOS-сборка ядра xnu-8796 (SWEET, Unisoc-порт) без GitHub Actions.
# Бесплатный тир: 500 мин Mac mini M2 в месяц (публичный репозиторий).
# Запуск: UI Codemagic -> Start new build (workflow "xnu").
workflows:
  xnu:
    name: xnu-8796 SWEET (DEVELOPMENT)
    max_build_duration: 110
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      groups: []
      vars:
        DXB_REPO: https://github.com/blacktop/darwin-xnu-build
        DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
        MACOS_VERSION: "13.5"
        KERNEL_CONFIG: DEVELOPMENT
        MACHINE_CONFIG: SWEET
    scripts:
      - name: deps (brew)
        script: |
          brew install -q jq gum bash cmake ninja || true
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
      - name: checkout dxb (darwin-xnu-build)
        script: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          # arm64 (не arm64e) kernel + обязательные наши патчи
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh
          python3 - <<'PYCODE'
          from pathlib import Path
          p = Path('dxb/build.sh')
          s = p.read_text()
          old = '                warning "Skipping patch ${PATCH}'
          new = ('                if [[ -f "${GITHUB_WORKSPACE:-$CM_BUILD_DIR}/xnu/patches/$(basename "$PATCH")" ]]; then\n'
                 '                    echo "ERROR Required patch failed: ${PATCH}: ${APPLY_CHECK}" >&2\n'
                 '                    exit 1\n'
                 '                fi\n'
                 '                warning "Skipping patch ${PATCH}')
          if s.count(old) != 1:
              raise SystemExit('build.sh patch loop anchor changed')
          p.write_text(s.replace(old, new))
          PYCODE
      - name: Xcode select
        script: |
          echo "=== установленные Xcode ==="
          ls -d /Applications/Xcode*.app
          XC=$(find /Applications -maxdepth 1 -type d -name 'Xcode_15*.app' | sort -V | head -1)
          if [ -z "$XC" ]; then
            XC=$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' | sort -V | head -1)
          fi
          test -n "$XC" || { echo "ERROR: Xcode отсутствует"; exit 1; }
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> $CM_ENV
          sudo xcode-select -s "$XC"
          xcodebuild -version
          # Xcode 16+ iig emits IORPC.kernelContent which xnu-8796 lacks:
          # patch 0116 ships Xcode 15.0.1 generated DriverKit files instead.
          export IIG_OFFLINE=1
          echo "IIG_OFFLINE=1" >> $CM_ENV
      - name: Build kernel
        script: |
          export MAKEFLAGS=-k
          cd dxb && bash build.sh
      - name: Collect kernel
        script: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true
          ls -la out
    artifacts:
      - out/**
    publishing: {}
