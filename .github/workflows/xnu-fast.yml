name: xnu-fast

on:
  workflow_dispatch:

jobs:
  relink:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Incremental compile and link on macos-15
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dxb k out /tmp/kobjs
          gh api repos/$GITHUB_REPOSITORY/actions/artifacts/12898383121/zip > bt.zip
          gh api repos/$GITHUB_REPOSITORY/actions/artifacts/12899630788/zip > k.zip
          unzip -qo bt.zip
          tar xzf buildtree.tgz -C dxb
          unzip -qo k.zip -d k

          # 1. Update dxb/xnu from 0e3c5319059e4e95b7ab5109486650343c9695e2 to HEAD patches
          for p in 0093-sweet-exec-inject.patch 0091-sweet-slay-absolute.patch 0090-sweet-sampler-unlock.patch; do
            git show 0e3c5319059e4e95b7ab5109486650343c9695e2:xnu/patches/$p | git -C dxb/xnu apply -R --verbose
          done
          for p in 0090-sweet-sampler-unlock.patch 0091-sweet-slay-absolute.patch 0093-sweet-exec-inject.patch; do
            git -C dxb/xnu apply --verbose "$GITHUB_WORKSPACE/xnu/patches/$p"
          done

          # 2. Build libfirehose_kernel.a
          git clone -q --depth 1 --branch libdispatch-1415.140.2 https://github.com/apple-oss-distributions/libdispatch.git /tmp/libdispatch
          mkdir -p dxb/fakeroot/usr/local/lib/kernel
          xcrun clang -arch arm64 -mmacosx-version-min=14.0 -mkernel -nostdinc -Wno-packed -O2 \
            -DKERNEL=1 -DKERNEL_PRIVATE=1 -DXNU_KERNEL_PRIVATE=1 -DARM64_BOARD_CONFIG_SWEET \
            -DDISPATCH_USE_DTRACE=0 -DOS_ATOMIC_CONFIG_MEMORY_ORDER_DEPENDENCY=1 -DOS_ATOMIC_CONFIG_STARVATION_FREE_ONLY=0 \
            -I/tmp/libdispatch \
            -Idxb/xnu/libkern -Idxb/xnu/libkern/firehose -Idxb/xnu/bsd -Idxb/xnu/osfmk -Idxb/xnu/osfmk/libsa -Idxb/xnu/pexpert -Idxb/xnu/libsa -Idxb/xnu/security \
            -Idxb/build/xnu.obj/EXPORT_HDRS -Idxb/build/xnu.obj/EXPORT_HDRS/osfmk -Idxb/build/xnu.obj/EXPORT_HDRS/bsd -Idxb/build/xnu.obj/EXPORT_HDRS/libkern -Idxb/build/xnu.obj/EXPORT_HDRS/iokit -Idxb/build/xnu.obj/EXPORT_HDRS/pexpert -Idxb/build/xnu.obj/EXPORT_HDRS/libsa -Idxb/build/xnu.obj/EXPORT_HDRS/security -Idxb/build/xnu.obj/EXPORT_HDRS/san \
            -Idxb/xnu/EXTERNAL_HEADERS -Idxb/fakeroot/usr/local/include -Idxb/fakeroot/usr/local/include/firehose -Idxb/sdk-kernel-platform/platform \
            -c /tmp/libdispatch/src/firehose/firehose_buffer.c -o /tmp/firehose_buffer.o
          xcrun libtool -static -o dxb/fakeroot/usr/local/lib/kernel/libfirehose_kernel.a /tmp/firehose_buffer.o

          # 3. Compile modified .c files and link kernel.development.sweet
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path

          ws = os.environ["GITHUB_WORKSPACE"]
          dxb = f"{ws}/dxb"
          clang = subprocess.check_output(["xcrun", "--find", "clang"], text=True).strip()
          clangxx = subprocess.check_output(["xcrun", "--find", "clang++"], text=True).strip()
          strip_bin = subprocess.check_output(["xcrun", "--find", "strip"], text=True).strip()

          def load_cflags(comp):
              raw = Path(f"{dxb}/build/xnu.obj/DEVELOPMENT_ARM64_SWEET/{comp}/DEVELOPMENT/.CFLAGS").read_text().replace("\x00", "").strip()
              raw = raw.replace("((1024 * 512) / MCLBYTES)", "((1024*512)/MCLBYTES)")
              parts = raw.split()[1:]
              out = []
              for p in parts:
                  p = p.replace("/Users/runner/work/ios-sweet/ios-sweet/dxb", dxb)
                  p = p.replace("/Applications/Xcode_15.0.1.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX14.0.sdk//System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform", f"{dxb}/sdk-kernel-platform/platform")
                  if p == "-I.":
                      p = f"-I{dxb}/build/xnu.obj/DEVELOPMENT_ARM64_SWEET/{comp}/DEVELOPMENT"
                  out.append(p)
              return out

          osfmk_flags = load_cflags("osfmk")
          bsd_flags = load_cflags("bsd")

          ar_path = f"{ws}/k/kernel.development.sweet.link/kernel.development.sweet.a"
          subprocess.check_call(["ar", "-x", ar_path], cwd="/tmp/kobjs")
          members = subprocess.check_output(["ar", "-t", ar_path], text=True).splitlines()
          members = [f"/tmp/kobjs/{m}" for m in members if m.endswith((".o", ".cpo"))]
          Path("/tmp/kobjs/all.filelist").write_text("\n".join(members) + "\n")

          targets = [
              (osfmk_flags, f"{dxb}/xnu/osfmk/kern/exception.c", "/tmp/kobjs/exception.o"),
              (bsd_flags,   f"{dxb}/xnu/bsd/dev/sweet_sample.c", "/tmp/kobjs/sweet_sample.o"),
              (bsd_flags,   f"{dxb}/xnu/bsd/dev/sweet_boot.c",   "/tmp/kobjs/sweet_boot.o"),
              (bsd_flags,   f"{dxb}/xnu/bsd/kern/kern_exec.c",   "/tmp/kobjs/kern_exec.o"),
              (bsd_flags,   f"{dxb}/xnu/bsd/kern/sweet_amfi.c",  "/tmp/kobjs/sweet_amfi.o"),
          ]
          for flags, src, obj in targets:
              print("Compiling", src, "->", obj, flush=True)
              subprocess.check_call([clang, *flags, "-c", src, "-o", obj])

          raw_ld = Path(f"{dxb}/build/xnu.obj/DEVELOPMENT_ARM64_SWEET/.LDFLAGS").read_text().replace("\x00", "").strip()
          ld_parts = [p.replace("/Users/runner/work/ios-sweet/ios-sweet/dxb", dxb) for p in raw_ld.split()[1:]]
          unstripped = f"{ws}/out/kernel.development.sweet.unstripped"
          final_k = f"{ws}/out/kernel.development.sweet"
          print("Linking", unstripped, flush=True)
          subprocess.check_call([
              clangxx, *ld_parts,
              "-filelist", "/tmp/kobjs/all.filelist",
              "-o", unstripped,
              f"-L{dxb}/fakeroot/usr/local/lib/kernel", "-lfirehose_kernel"
          ])
          print("Stripping ->", final_k, flush=True)
          subprocess.check_call([strip_bin, "-S", unstripped, "-o", final_k])
          os.remove(unstripped)
          PY
          ls -la out/
          (cd out && shasum -a 256 kernel.* > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: xnu-kernel
          path: out/
